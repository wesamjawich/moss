<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Koke Moss Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="view" aria-label="A moss garden seen from above"></canvas>
<div id="ring" hidden></div>
<div id="sel" hidden></div>

<header class="brand ui">
  <span class="kanji" aria-hidden="true">苔</span>
  <div>
    <h1>Koke</h1>
    <p id="readout">Year 1 · moss cover 0%</p>
  </div>
</header>

<div class="corner ui">
  <button type="button" id="sound" class="glass round" title="Sound" aria-pressed="false"></button>
  <button type="button" id="hide" class="glass round" title="Hide the controls (H)"></button>
  <button type="button" id="shot" class="glass round" title="Save a picture (P)"></button>
</div>
<button type="button" id="show" class="glass round" title="Show the controls" hidden></button>

<p id="hint" class="ui">Press and drag to sow moss</p>
<p id="toast" role="status" hidden></p>
<p id="fail" hidden>This garden needs WebGL 2, which this browser did not provide.</p>

<div id="dock" class="ui">
  <section id="objpanel" class="glass panel" aria-label="Selected object" hidden>
    <strong id="objname">Rock</strong>
    <label for="objsize"><span>Size</span><input id="objsize" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label for="objturn"><span>Turn</span><input id="objturn" type="range" min="0" max="360" step="1" value="0"></label>
    <div class="row"><button id="objremove" type="button">Remove</button><button id="objdone" type="button">Done</button></div>
  </section>

  <section id="panel" class="glass panel" aria-label="Scene" hidden>
    <div class="seg" id="moods" role="group" aria-label="Time of day">
      <button type="button" data-mood="dawn">Dawn</button>
      <button type="button" data-mood="day" class="on">Day</button>
      <button type="button" data-mood="dusk">Dusk</button>
      <button type="button" data-mood="night">Night</button>
    </div>
    <label for="speed"><span>Time</span><input id="speed" type="range" min="0" max="6" step="1" value="3"><output id="speedOut">1×</output></label>
    <label for="humidity"><span>Humidity</span><input id="humidity" type="range" min="0.3" max="1" step="0.01" value="0.72"><output id="humidityOut">72%</output></label>
    <label for="light"><span>Canopy light</span><input id="light" type="range" min="0" max="1" step="0.01" value="0.5"><output id="lightOut">50%</output></label>
    <label for="size"><span>Brush</span><input id="size" type="range" min="0.01" max="0.12" step="0.002" value="0.04"><output id="sizeOut">M</output></label>
    <div class="row">
      <button id="petals" type="button" aria-pressed="false">Cherry petals</button>
    </div>
    <div class="row">
      <span class="rowlabel">New garden</span>
      <button id="newComposed" type="button">Composed</button>
      <button id="newSurprise" type="button">Surprise me</button>
      <button id="newBare" type="button">Bare earth</button>
    </div>
  </section>

  <nav class="glass bar" aria-label="Tools">
    <div id="tools" class="tools"></div>
    <div id="tabs" class="tabs" role="tablist"></div>
  </nav>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
