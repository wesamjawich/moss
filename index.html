<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Koke Moss Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="view" aria-label="A stone surface on which moss grows"></canvas>
<div id="ring" hidden></div>

<header class="brand">
  <span class="kanji" aria-hidden="true">苔</span>
  <div>
    <h1>Koke</h1>
    <p id="readout">Year 1 · moss cover 0%</p>
  </div>
</header>

<p id="hint">Press and drag to sow moss</p>
<p id="fail" hidden>This garden needs WebGL 2, which this browser did not provide.</p>

<section id="panel" class="glass" aria-label="Climate" hidden>
  <label for="speed"><span>Time</span><input id="speed" type="range" min="0" max="8" step="1" value="2"><output id="speedOut">2×</output></label>
  <label for="humidity"><span>Humidity</span><input id="humidity" type="range" min="0.3" max="1" step="0.01" value="0.72"><output id="humidityOut">72%</output></label>
  <label for="light"><span>Canopy light</span><input id="light" type="range" min="0" max="1" step="0.01" value="0.5"><output id="lightOut">50%</output></label>
  <label for="size"><span>Brush</span><input id="size" type="range" min="0.01" max="0.12" step="0.002" value="0.04"><output id="sizeOut">M</output></label>
  <div class="row">
    <button id="surface" type="button">Surface: stone</button>
    <button id="fresh" type="button">New surface</button>
    <button id="clear" type="button">Bare</button>
  </div>
</section>

<nav class="tools glass" aria-label="Tools">
  <button type="button" data-tool="1" class="on" title="Sow spores (1)">
    <svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="1.4"/><circle cx="13" cy="5" r="1.1"/><circle cx="17" cy="10" r="1.5"/><circle cx="10" cy="13" r="1.2"/><circle cx="15" cy="16" r="1.1"/><circle cx="7" cy="18" r="1.4"/></svg>
    <span>Sow</span>
  </button>
  <button type="button" data-tool="2" title="Mist (2)">
    <svg viewBox="0 0 24 24"><path d="M12 3.5c3 3.6 5.2 6.4 5.2 9.4a5.2 5.2 0 0 1-10.4 0c0-3 2.2-5.800 5.2-9.4z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <span>Mist</span>
  </button>
  <button type="button" data-tool="3" title="Warm and dry (3)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2.5M12 18.500V21M3 12h2.500M18.500 12H21M5.600 5.600l1.800 1.800M16.600 16.600l1.800 1.800M5.600 18.400l1.800-1.800M16.600 7.400l1.800-1.800" stroke="currentColor" stroke-width="1.500" stroke-linecap="round"/></svg>
    <span>Warm</span>
  </button>
  <button type="button" data-tool="4" title="Scrape (4)">
    <svg viewBox="0 0 24 24"><path d="M5 19l9.500-9.500M13 5.500l5.500 5.500-3 3-5.500-5.500z" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>Scrape</span>
  </button>
  <i class="sep" aria-hidden="true"></i>
  <button type="button" id="rain" title="Rain (R)">
    <svg viewBox="0 0 24 24"><path d="M7 14.500a4 4 0 0 1 .600-7.960 5 5 0 0 1 9.600 1.200A3.400 3.400 0 0 1 17 14.500z" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"/><path d="M9 17.500l-1 2.500M13 17.500l-1 2.500M17 17.500l-1 2.500" stroke="currentColor" stroke-width="1.500" stroke-linecap="round"/></svg>
    <span>Rain</span>
  </button>
  <button type="button" id="tune" title="Climate" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1" stroke="currentColor" stroke-width="1.500" stroke-linecap="round"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.500"/><circle cx="9" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.500"/><circle cx="17" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.500"/></svg>
    <span>Climate</span>
  </button>
</nav>
<script type="module" src="/src/main.js"></script>
</body>
</html>
